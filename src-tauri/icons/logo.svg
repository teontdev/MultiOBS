<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- MultiOBS logo: brand disc (black, light-blue arc, white cloud) with three parallel stream arrows. -->
  <defs>
    <clipPath id="inner"><circle cx="512" cy="512" r="468"/></clipPath>
    <g id="arrow" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 40 450 C 250 420, 520 340, 760 230"/>
      <path d="M 687 213 L 760 230 L 730 298"/>
    </g>
  </defs>
  <circle cx="512" cy="512" r="508" fill="#000"/>
  <g clip-path="url(#inner)">
    <path d="M 96 345 C 170 180, 330 70, 520 66" fill="none" stroke="#9dc3e6" stroke-width="36" stroke-linecap="round"/>
    <use href="#arrow"/>
    <use href="#arrow" transform="translate(-110 150)"/>
    <use href="#arrow" transform="translate(-220 300)"/>
    <g fill="#fff">
      <circle cx="150" cy="930" r="220"/>
      <circle cx="440" cy="1030" r="250"/>
      <circle cx="760" cy="900" r="230"/>
      <circle cx="990" cy="860" r="210"/>
    </g>
  </g>
</svg>
